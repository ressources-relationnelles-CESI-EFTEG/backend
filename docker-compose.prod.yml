# Stack de production — API NestJS + PostgreSQL.
# Lecture des secrets dans .env.prod (non commité, à créer depuis
# .env.prod.example). Voir docs/DEPLOYMENT.md pour la procédure.
#
# Démarrage :
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Migrations Prisma à appliquer après chaque déploiement :
#   docker compose -f docker-compose.prod.yml exec api npx prisma migrate deploy
#
# Hypothèses production :
#   - Un reverse-proxy (nginx/traefik) en amont gère TLS et le routing.
#     L'API expose 3001 uniquement sur l'interface locale (127.0.0.1).
#   - PostgreSQL n'est pas exposé sur l'hôte (uniquement sur le réseau interne).
#   - SWAGGER_ENABLED=false (à valider dans .env.prod).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rr-backend:prod
    container_name: rr-api-prod
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Exposition locale uniquement — le reverse-proxy s'occupe du public
      - "127.0.0.1:3001:3001"
    volumes:
      - api_uploads_prod:/app/uploads
    networks:
      - rr-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    container_name: rr-db-prod
    restart: always
    env_file: .env.prod
    volumes:
      - postgres_prod:/var/lib/postgresql/data
    networks:
      - rr-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_prod:
    name: rr-postgres-prod
  api_uploads_prod:
    name: rr-api-uploads-prod

networks:
  rr-prod:
    name: rr-prod-net
