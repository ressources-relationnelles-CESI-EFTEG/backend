services:
  db-test:
    image: postgres:16-alpine
    container_name: rr-cesi-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rr_cesi_test
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d rr_cesi_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes: {}
